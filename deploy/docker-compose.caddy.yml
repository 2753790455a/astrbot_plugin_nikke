services:
  caddy:
    image: m.daocloud.io/docker.io/library/caddy:2-alpine
    container_name: nikke-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /opt/nikke-bot/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/nikke-bot/caddy/data:/data
      - /opt/nikke-bot/caddy/config:/config
    networks:
      - nikke-bot
    logging:
      options:
        max-size: "20m"
        max-file: "3"

networks:
  nikke-bot:
    external: true

